name: copia
description: Copia modernized Android reader.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.34
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7
  pdfx: ^2.7.0
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  open_filex: ^4.7.0
  just_audio: ^0.9.46
  audio_service: ^0.18.16
  audio_session: ^0.1.21
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  http: ^1.3.0
  uuid: ^4.5.1
  archive: ^3.6.1
  screenshot: ^3.0.0
  collection: ^1.19.1
  crypto: ^3.0.6
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2
  flutter_tts: ^4.2.3
  syncfusion_flutter_pdf: ^32.2.4
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.0

dependency_overrides:
  platform: ^3.1.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/IntroImages/
  fonts:
    - family: owl
      fonts:
        - asset: assets/Fonts/Owl.ttf
    - family: cormorant
      fonts:
        - asset: assets/Fonts/cormorant.ttf
